command = Hier ist eine List mit allen wichtigen Commands:\n-attack/kampf "Person"\n-walk/gehe\n-talk/sprich "Person"\n-take/nimm "Item"\n-look/umsehen/l\n-use/verwende "Item"\n\nWenn du noch mehr Commands haben möchtest schreib "mehr/more Commands"

help = Du solltest dich für den Anfang erstmal mit "umsehen/look/l" einmal umschauen was es gibt!\nWenn du eine Liste mit allen Commands haben willst, kannst du "Command" eingeben!\nFalls du irgendwo feststeckst solltest du vielleicht mal mit "Tipp" Versuchen

mehr_command = Hier sind noch mehr Commands die du verwenden könntest:\n-stop/exit\n-drop/ablegen "Item"\n-tipp\n-inventar/i\n-Scan "Person"\n-stats

inventar = Du hast in deinem Inventar folgende Items:

leer_inventar = Dein Inventar ist leer
#0: Leben, 1: Waffe, 2: Schaden
stats = Leben: {0}\nMomentane Waffe: "{1}"\nSchaden: {2} Schaden
#0: Leben
stats_no_waffe = Leben: {0}\nKeine Waffe ausgerüstet: 1 Schaden

tipp_1 = Manchmal musst du mehrmals mit einer Person sprechen, um das zu bekommen, was du willst

tipp_2 = Achte auf Sachen die GROßGESCHRIEBEN sind

tipp_3 = Man kann sich leicht verlaufen. Merke dir gut wo was ist

tipp_4 = Jeder Raum hat Sachen, womit man Interagieren kann. Mit "umsehen/look/l" kannst du sehen, was es hier gibt.

tipp_5 = Du kannst zwar kämpfen, aber du wirst Leben verlieren, die du später vielleicht brauchen wirst. Es gibt immer eine friedliche Lösung

tipp_6 = Ein Befehl besteht immer aus 2 Teilen. Das erste Wort ist immer eine HANDLUNG und alles, was danach kommt, sind spezifizierungen, womit du genau interagieren möchtest.

tipp_7 = Keine Lust immer "Walk/Gehe" zu schreiben? Du kannst nur den Anfangsbuchstaben der Himmelsrichtung schreiben wie "n" für Norden und das Spiel weiß, was du meinst

baustelle_tipp1 = Hier gibt es viele Ranken, vielleicht kannst du diese mit irgendwas durchschneiden?

kindergarten_tipp1 = Befreunde dich erstmal mit einer Person, bevor du Sachen oder informationen von ihr verlangst