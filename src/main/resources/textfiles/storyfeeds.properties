start_screen = Schreibe "Start" um das Spiel zu starten
tod = \nSchreibe "Start" um das Spiel neuzustarten

intro_text = Es ist ein wünderschöner sonniger nachmittag. Du lebst in einer perfekten Kleinstadt, wo scheinbar nichts Spannendes passiert. Jeder scheint jederzeit glücklich zu sein und so was wie einen schlechten Gedanken gibt es hier nicht. Zumindest bis heute, als du einen Mann siehst, der nicht aufhören kann dich anzustarren...
#0: Tagebuch name
tagebuch_finden = Du willst dich ins Bett schlafen legen, aber als du dich reinlegen willst, fällt ein {0} heraus.

substanz_1 = Du nimmst die verbotene Substanz ein. Deine Sicht wird unklarer, aber dein Verstand wird klarer und du fühlst dich entspannter.
substanz_2 = Du versuchst etwas zu machen, allerdings spürst du die Stärke der verbotenen Substanz immer stärker werden. Du setzt dich hin, um besser klarzukommen.
substanz_3 = Du wartest... paar Stunden vergehen, aber du verlierst immer mehr die Kontrolle über deinen Körper.
substanz_4 = Du versuchst irgendwas zu machen. Allerdings spürst du, dass du die Kontrolle von deinem Körper verlierst und du kannst nicht erklären was passiert.
substanz_5 = Du fängst an dich zu bewegen, aber du kontrollierst es nicht. Du schaust zu wie dein eigener Körper selbstständig mit Menschen interagiert und sein Leben lebt, ohne dass du einfluss drauf hast.
substanz_6 = Während du versuchst zu verstehen was passiert, merkst du, dass du immer weniger und weniger verstehst. Menschen, die dir entgegenkommen wirken, verschwommen und die Wörter, die sie sagen werden, undeutlich.
substanz_7 = Ein haufen Glückshormone werden ausgestrahlt und du vergisst was trauer und schmerzen sind. Du bist in deiner eigenen Utopie gelandet, ohne wirklich zu verstehen was passiert.\nDu hast das "Status quo" Ending erreicht.

tagebuch_1 = Tag 1:\n"Heute ist mein erster Tag in meinem neuen Zuhause! Ich habe einen neuen Job bekommen für eine Entwicklung, welche die Welt verändern soll. Ich kann es kaum erwarten!"
tagebuch_2 = Tag 14:\n"2 Wochen sind jetzt vergangen und bisher liebe ich diesen Job. Nach all den Jahren von kapitalistisch getriebenen Projekten kann ich endlich etwas machen, was die Welt verändern kann. Wir erschaffen einen Computer-Chip, welcher in den Kopf gesetzt werden soll und pure Glückshormone ausstrahlt. Sie nennen ihn "Happy Maker"... ich finde, wer auch immer auf diesen Namen kam, sollte gefeuert werden!"
#sandra, markus
tagebuch_3 = Tag 57:\n"Wir haben endlich unseren ersten Prototypen des Chips fertiggestellt und haben ihn auch direkt ins Gehirn einer Ratte platzieren können. Ihr Verhalten war sehr vielversprechend! {0} und {1} sagen zwar wir haben noch einen langen Weg, aber ich sage, wir sind fast am Ziel!"
tagebuch_4 = Tag 149:\n"Wir sind inzwischen sehr weit mit unserem Chip gekommen. Wir haben offiziell den ersten Test an Menschen ausprobiert. Ein großes Problem war, dass die Menschen unter großem Gedankenverlust leiden. Wir wissen noch nicht die Ausmaße des Gedanken Verlustes, aber ich hab das Gefühl, dieser Bug, wird noch zu einem großen Problem!"
tagebuch_5 = Tag 273:\n"Neuer Tag und ein neues Problem. Scheinbar deaktiviert sich der Chip, bei großen Stromschlägen. Ich hab für jetzt nen Feature eingebaut, dass wenn man Knabenkraut zu sich nimmt, der Chip neu gestartet wird, aber das ist nur eine momentane Lösung, solange ich noch am Gedankenverlust Problem arbeite."
tagebuch_6 = Tag 524:\n"Ich hasse es. Ich kriege diesen Bug nicht weg! Nächste Woche müssen wir den Investoren unserem Chip zeigen und wir sind nicht Mal annähernd fertig. Eine Lösung, die ich gefunden habe, ist die Person auf Instinkten laufen zu lassen und ihn sozusagen den freien Willen wegzunehmen, aber kann ich das wirklich übers Herz bringen, so was Unmenschliches zu bauen?"
tagebuch_7 = Tag 666:\n"Heute ist unser Chip offiziell rausgekommen und ich fühle mich extremst unwohl. Wir konnten das Problem mit dem Gedankenverlust stoppen, aber wir konnten nicht genug testen. Der Fehler könnte sehr wohl zurückkommen. Außerdem hat uns die Firma kurzfristig gefeuert, damit sie uns nicht unsere Anteile Zahlen müssen. Das heißt auch, dass wir nicht weiter an den Fehlern weiterarbeiten können."
#sandra
tagebuch_8 = Tag 1693:\n"Wir haben verloren! Der Oberrat, hat beschlossen, dass alle Menschen auf dem Planeten diesen Chip bekommen sollen, aber sie wissen nicht wie unsicher der ist. Alle Chips laufen auf einen Server und wenn jeder einen bekommt, würde dieser überlasten. Ich und {0} haben angefangen eine bessere Version zu bauen, aber wir werden niemals damit fertig werden bevor das Gesetz durch kommt"
tagebuch_9 = Tag ???\n"Ich kann mich nicht erinnern irgendwas davon jemals geschrieben zu haben. Der Gedankenverlust scheint zurückgekommen zu sein. Ich weiß, ich muss was dagegen machen, aber alle sind glücklich! Ich bin zufrieden und das ist das worum es geht."
tagebuch_10 = Tag ???\n"Ich kann mich nicht erinnern irgendwas davon jemals geschrieben zu haben, aber der letzte Text klingt so anders. Das klingt nicht nach mir. Bin das ich? Laufe ich auf Instinkten? Wenn der Gedankenverlust zurückkommen konnte, warum auch nicht dieses feature?"
#sandra, markus
tagebuch_11 = Tag ???\n"Ich habe erneut dieses Tagebuch wiedergefunden. Auch wenn ich kein wirklich schlechtes gewissen spüre, merke ich, dass ich was machen muss. Ich hab die Skizzen auf meinem Computer wiedergefunden und hab angefangen, an der neuen Version weiterzuarbeiten. Ich hab versucht hilfe zu finden, aber ich konnte nicht herausfinden, wer {0} ist und {1} scheint ein Junkie geworden zu sein, also bin ich auf mich selbst angewiesen."
tagebuch_12 = Tag ???\n"Schlechte neuigkeiten. Ich konnte endlich eine gute Version des Chips erstellen, aber mein Computer ist durchgebrannt und ich weiß nicht, ob ich mit dieser kurzen Zeit wo ich mental verfügbar bin es schaffen kann diesen richtig zu reparieren. Vielleicht sollte ich dieses Buch wegwerfen und akzeptieren, dass das unsere Welt ist. Immerhin bin ich glücklich und will nichts daran ändern."
tagebuch_13 = Tag ???\n"Ich habe grad das Buch wiedergefunden und glaube, ich hab eine Lösung gefunden. Am anfang des Buches hab ich von deaktivierungen mit Stromschlägen geschrieben. Auf einer Baustelle hab ich heute ein hängendes Rohr mit paar Stromkäbeln gefunden. Wenn ich schaffe, dass dieses auf mich darauf fällt und mir einen Schlag gibt kann ich diesen hoffentlich ausschalten und unsere Welt retten! Ich bezweifle, dass ich mich an irgendwas erinnern werde, aber solange ich kein schlechtes Gewissen spüre kann ich diese Welt nicht retten. Es ist riskant aber es ist ein Versuch wert. Falls du dieses Buch in der Zukunft lesen wirst, weißt du genau was zu tun ist. STOPPE DIESEN COMPUTER CHIP"



tagebuch_ende = Die restlichen Seiten des Tagebuchs scheinen voll mit irgendwelchen Zeichnungen von Computer Code und Computer-Chips zu sein.\nDu schließt das Tagebuch.


brief_lesen1 = Du öffnest den Brief und liest ihn:\n"Lieber Arthur, ich weiß nicht, ob ich es dir jemals gesagt habe, aber ich wollte mich mal bei dir bedanken. Seitdem du mir diese Pflanze gezeigt hast, welche den Verstand verändert, fühlt sich das leben wirklich lebenswert an. Dieses unangenehme Gefühl abgibt ist einfach unbeschreiblich, aber dadurch fühlt sich das restliche Leben soviel besser an und ich kann es mehr wertschätzen. Deshalb gebe ich mir auch immer sehr viel mühe deinen Scanner so gut wie möglich auszustatten. Vermutlich werde ich wieder vergessen dir diesen Brief zu geben, aber falls du ihn trotzdem siehst, hoffe ich du checkst was mir das bedeutet.\nLG. Markus"





sterben = Deine Leben sind auf 0 gelandet

1_beenden = Bist du dir sicher, dass du das Spiel beenden möchtest?\n1: Ja\n2: Nein

beendet = Das Spiel wurde beendet.

not_beenden = Du entscheidest dich dazu doch noch fortzufahren!




start_finale = Du willst den Computer-Chip aus dem Server rausnehmen. Du gehst zum Server und schraubst die Schrauben, langsam und vorsichtig aus der Haltung, als du plötzlich eine Stimme hinter dir hörst




ende_1 = Du nimmst den Computer Chip aus dem Behälter. Du wartest etwas um zu schauen was passiert, als du laute Geräusche von draußen hörst.\nDu gehst raus um zu sehen, woher die Geräusche kommen und du siehst ein haufen Menschen, welche sehr verwirrt aussehen. Niemand von denen weiß, was grad passiert ist und niemand weiß, dass sie unendliche Glücklichkeit für freien Willen aufgegeben haben.\nDu fühlst dich gut, dass du die Menschheit gerettet hast, aber trotzdem hast du das Gefühl, dass du der Menschheit etwas weggenommen hast. Hätte es nur einen Weg gegeben, die Freude zu bewahren und trotzdem den freien Willen zu behalten...\nDu hast das "Freiheits" Ending erreicht.
ende_2 = Du tauschst den Computer-Chip mit dem kaputten Computer-Chip aus. Du wartest etwas um zu schauen was passiert, als das Terminal neben dem Chip auf einmal sehr viele Fehlermeldungen ausgibt.\nPlötzlich siehst du Rauch aus dem Kopf von Arthur kommen. Du schaust aus dem Fenster und deine ängste bestätigen sich. Die Köpfe aller Menschen fangen an zu rauchen und einer nach dem anderen fällt um.\nPlötzlich hörst du ein lautes Brummen. Du spürst eine starke wärme in deinen Kopf die immer schlimmer wird. Du versuchst den Chip rauszunehmen, aber die Wärme wird so schlimm, dass du dich nicht mehr konzentrieren kannst. Und dann hörst du ein ganz kleines *plop*.\nDu hast das "Bad" Ending erreicht.
ende_3 = Du tauschst den Computer-Chip mit dem reparierten Computer-Chip aus. Du wartest etwas um zu schauen was passiert, der Server braucht lange um die neuen Regeln zu akzeptieren. Doch plötzlich spürst du wie sich dein Chip wieder aktiviert!\nDu verfällst in Panik und versuchst den Server wieder auszuschalten, als du es spürst. Pure Freude. Du bist glücklich, aber du hast immer noch die Kontrolle über deinen Körper. Du spürst alte erinnerungen welche langsam zurückkommen, aber bis du dich wieder an alles erinnern kannst wird es noch etwas dauer.\nDu gehst raus um zu sehen wie jeder sein Leben wieder genießen kann! Aber nicht mit einschränkungen. Sondern so wie es sich jeder Wünscht. Du hast es geschafft. Du hast die Perfekte Welt geschaffen!\nDu hast das "UTOPIE" Ending erreicht.
ende_4 = Du entscheidest dich nicht den Computer-Chip zu entfernen! Du setzt dich hin und überlegst dir, ob du die richtige Entscheidung getroffen hast.\nHatte Arthur recht? Die Menschen sind glücklich und du hast nicht die Berechtigung den Menschen diese Freude weg zu nehmen.\nDiese Welt braucht einen Beschützer. Kein Mensch darf alleine über diese Welt entscheiden, aber du kannst dafür sorgen, dass niemand alleine entscheiden muss. 2 Menschen, 2 Beschützer, 2 Meinungen. Du kannst Arthur helfen. Ihr könnt die Menschheit beschützen. Ihr könnt euch aufopfern, damit alle anderen in einer UTOPIE Leben können\nDu hast das "Aufopferungs" Ending erreicht.