falsche_antwort = Bitte schreibe eine gültige antwortmöglichkeit auf


#direkt Enter
nur_enter = Bitte schreib das Enter am Ende des Satzes und nicht am Anfang
#kein Handler
nicht_existent = Mir ist dieser Command leider nicht bekannt. Falls du hilfe brauchst, kannst du "help/hilfe" schreiben

keine_richtung = Das ist leider keine richtung wo du hingehen kannst, versuche mal einer der richtungen "Norden", "Süden", "Osten" oder "Westen" auszuprobieren

abgesperrt = Dieser Weg scheint abgesperrt zu sein! Versuch mal in eine andere Richtung zu laufen!

kein_item_angegeben = Vergiss nicht den Namen des Items dazuzuschreiben
#0: falsches Item
item_none = Es gibt leider kein Item mit dem Namen: "{0}"

keine_waffe = Du kannst nur Waffen ausrüsten!

kein_essen = Du solltest das besser nicht essen

kein_buch = Du kannst nur Bücher oder andere Items solcher Art lesen

kein_scanner = Du kannst momentan keine Personen scannen
#0: Namen
peron_none = Es gibt leider keine Person mit dem Namen: "{0}" in diesem Raum

keine_person_angegeben = Vergiss nicht den Namen der Person dazuzuschreiben

oma_kampf = Bitte antworte mit "1", wenn du das Tutorial vom Kampf starten möchtest und "2", wenn du zuerst was anderes machen möchtest

tod_gespräch = Du willst ein Gespräch starten... dein Gegenüber scheint nicht sehr gesprächig zu sein.

tod_kampf = Du versuchst einen Kampf zu starten... Du hast bereits gewonnen.

wandlauf = Du läufst gegen eine Wand eines Labors. Vielleicht solltest du es mal in eine andere Richtung versuchen!

vilian_ausgang = Du bist im Labor. Du kommst nur durch den Ausgang raus (er ist im Süden, falls du vergessen hast)

strong_guard = Du versuchst ins Labor zu kommen. Allerdings hält dich der Security Guard auf.

still_Item = Du solltest dieses Item nicht im Inventar haben
#0: KabelName
stuck_kabel = Du versuchst das {0} zu nehmen, aber es steckt unter dem {1} fest.

wrong_beendet = Bitte antworte, ob du das Spiel beenden willst mit entweder "Ja" oder "Nein"

none_break = Du willst was kaputt machen! Allerdings gibt es nichts was du kaputt machen kannst

none_lesen = Schreibe entweder "Ja" oder "Nein" ob du den Brief lesen möchtest?

take_hund = Der Hund will nicht mitgenommen werden, weshalb er dich beißt. Du verlierst '10' Leben

take_hund_again = Du versuchst den Hund zu nehmen. Du füllst dich jedoch zu schlecht den Hund zu klauen

take_chip = Du versuchst den Computer-Chip zu nehmen, aber wirst von einer Glasscheibe aufgehalten.

tagebuch_wrong_password = Das ist leider das falsche Passwort. Du schließt das Buch wieder.

take_substanz_farmer = Du versuchst eine Pflanze zu ernten! Der FARMER sagt dir allerdings, dass diese noch ausreifen muss.
take_substanz_wachsen = Du versuchst eine Pflanze zu ernten! Du merkst allerdings, dass diese noch nicht ausgereift ist und lässt sie liegen.
take_substanz_polize = Du versuchst die Pflanze aus der Aufbewahrungsbox zu nehmen, aber der Polizist weist dich darauf hin, dass dies Illegal ist

drop_chip = Du bist so nah am Ziel. Du kannst den Chip jetzt nicht verlieren!
#0: name
take_pipe = Du versuchst das {0} zu nehmen, aber es scheint von Ranken und Kabeln zugewachsen zu sein.

drop_substanz = Du hast das Gefühl, wenn du es hier fallen lässt, wirst du es nie wieder sehen!

glas_einschlagen = Du versuchst die Glasscheibe einzuschlagen. Du realisierst außerdem, dass du mehr Sport machen solltest
#verb
ranken_zerschneiden = Du schneidest die Ranken mit "{0}" durch! Die Kabel und das Metal Rohr liegen jetzt lose auf dem Boden

ranken_nicht_scharf = Du versuchst die Ranken durchzuschneiden! Allerdings hast du nichts Scharfes an dir.

computer_leer = Scheint als, wenn du alles auf dem Computer bereits gesehen hast