dropped_item = Du hast außerdem ein paar Items in diesem Raum liegen lassen:

park_opening = Du betrittst den Park! Das ist der Ort wo diese Geschichte begonnen hat.

park_l1 = Du stehst in einem Park.
park_l2 = Du siehst in der Ferne eine OMA, welche einem HUND zusieht.
park_oma_schaut_stock = Du siehst in der Ferne eine Oma, welche einen Stock auf dem Boden anstarrt
park_einsam_oma = Du siehst in der Ferne eine Oma, welche die Natur genießt.
park_l3 = Der HUND spielt mit einem STOCK, welcher gut als eine Waffe verwändet werden könnte.
park_l5 = Du siehst einen HUND der mit einer alten Frau stöckchen fangen spielen will. Die Frau scheint nicht zu reagieren.

park_hund_existenz = Du siehst einem Hund in der Ferne
park_hund_freund = Der HUND starrt dich an und will scheinbar mit dir spielen.
park_hund_feind = Der HUND starrt dich an und ist, warum auch immer sehr sauer auf dich.

park_nur_stock = Der Park sieht sehr leer aus, außer einem etwas angeknabbertem Stock auf dem Boden.
park_nichts = Du genießt die leere im Park und bist froh, dass es so ruhig ist.


park_l7 = Außerdem steht neben dir ein MANN, welche versucht dich unter keinen Umständen anzustarren. Es scheint ihm sehr schwer zu fallen.
park_l8 = Außerdem steht neben dir ein MANN der dich anstarrt und nicht den Blick von dir verliert. Mit dem solltest du vielleicht als Erstes sprechen


kinder_open = Du betrittst den Kindergarten. Du spürst beim Betreten direkt ein Gefühl von BOSHAFTIGKEIT

kinder_l1 = Der Kindergarten ist von Natur aus ein sehr gefährlicher Ort.
kinder_l2 = Am auffälligsten ist ein kleines MÄDCHEN, welches bei einem JUNGEN steht und ihn die ganze Zeit zwickt!
kinder_l3 = In der Ecke steht ein kleiner JUNGE, welcher alleine mit seinem SPIELSCHWERT steht.
kinder_l4 = Auf der anderen Seite spielt ein kleines hyperaktives MÄDCHEN! Sie schaut den JUNGEN mit einem schelmischen Blick an.
kinder_l5 = Auf der anderen Seite liegt ein kleines MÄDCHEN. Sie scheint sich, warum auch immer nicht sehr viel zu bewegen.
kinder_l6 = In der Ecke liegt ein kleiner JUNGE, welcher sich nicht bewegt. Er sieht etwas verletzt zu sein.
kinder_l7 = Auf der anderen Seite spielt ein kleines hyperaktives MÄDCHEN! Sie scheint den anderen Jungen nicht zu beachten
kinder_l8 = Auf der anderen Seite liegt außerdem ein MÄDCHEN. Sie scheint sich genauso wenig wie der JUNGE zu bewegen.


farm_open = Du betrittst eine Farm. Es scheinen keine Tiere hier zu geben. Es wird nur die eine und selbe Pflanze angebaut.

farm_l1 = Du bist auf einer kleinen Farm wo scheinbar nur eine Art von Pflanze angebaut wird.
farm_l2 = Einige der PFLANZEN scheinen auch schon ernte bereit zu sein!
farm_l3 = Leider sind die PFLANZEN noch nicht ausgereift, vielleicht kann man sich später was nehmen.
farm_l4 = Es wurden allerdings bereits alle reifen Pflanzen geerntet :(
farm_l5 = In der Mitte der Farm steht ein offener Glascontainer mit einem KAPUTTEN COMPUTER-CHIP drinnen.
farm_l6 = In der Mitte der Farm steht ein verschlossener Glascontainer mit einem KAPUTTEN COMPUTER-CHIP drinnen.
farm_l7 = In der Mitte der Farm steht ein offener Glascontainer.
farm_l8 = Daneben sitzt ein FARMER und bewacht den Glascontainer. Er scheint keinen guten Job zu machen
farm_l9 = Daneben sitzt ein FARMER und bewacht den Glascontainer.


zuhause_opening = Du betrittst ein Gebäude, welches dir sehr bekannt vorkommt. Es ist dein Zuhause!

haus_l1 = Obwohl du hier wohnst, scheint dir der Ort fremd.
haus_computer_heile = Du hast nicht sehr viel hier, außer ein BETT und einen Schreibtisch, wo ein COMPUTER draufsteht.
haus_computer_kaputt = Du hast nicht sehr viel hier, außer ein BETT und einen  Schreibtisch, wo ein kaputter COMPUTER draufsteht.
haus_l2 = Auf dem Tisch ist außerdem ein offener JOGHURT, welcher schon seit mehreren Wochen, abgelaufen zu sein scheint
haus_l3 = Scheinbar wurde dieser mit einer GABEL gegessen. Eine sehr verwirrende Wahl, wo du allerdings 100% hinter stehst.
haus_l4 = Ansonsten scheinst du nicht mehr viel dazuhaben. Die gesamte Wohnung wirkt sehr schäbig und einsam.
haus_l5 = Auf dem Tisch ist außerdem eine GABEL mit paar Schimmel flecken dran.
haus_l7 = Auf dem Boden liegt außerdem ein verstaubtes TAGEBUCH.


hauptstrasse_opening = Du betrittst die Hauptstraße. Erstaunlicherweise ist hier sehr wenig los.

strasse_l1 = Du stehst auf einer Straße, mit vielen verlassenen Geschäften.
strasse_tod = Am auffälligsten ist ein großer Verkaufsstand. Die VERKÄUFERIN, scheint gerade nicht verfügbar zu sein
strasse_tod_mit_hund = Am auffälligsten ist ein großer Verkaufsstand, welcher scheinbar von einem HUND geführt wird.
strasse_allein = Am auffälligsten ist ein großer Verkaufsstand, welcher von einer netten VERKÄUFERIN, geführt wird.
strasse_hund = Am auffälligsten ist ein großer Verkaufsstand, welcher von einer netten VERKÄUFERIN und Ihrem Hund geführt wird.
strasse_magier = Am Ende der Straße steht außerdem ein Magier, welcher dich mit Kartentricks versucht zu beeindrucken.


polizei_opening = Du betrittst die Polizeistation. Sie scheint ziemlich unbewacht zu sein

polizei_l1 = Für eine Polizeistation, scheint relativ wenig los zu sein.
polizisz_da = Es gibt nur einen POLIZISTEN, welcher dich gut im Auge behält.
polizist_verkleidet = Es gibt nur einen POLIZISTEN, welcher dich freundlich anlächelt.
polizist_weg = Der einzige POLIZIST weit und breit scheint auf dem Boden zu liegen.
polizist_weed_da = In der Mitte des Raumes siehst du eine schwarze Box, wo eine verdächtige PFLANZE drinnen liegt.
polizist_weed_weg = In der Mitte des Raumes siehst du eine schwarze Box, welche leer zu sein scheint.


bau_opening = Du betrittst eine Baustelle. Es scheint hier sehr wenig gearbeitet zu werden.

bau_l1 = Diese Baustelle scheint nahe zu keinen einzigen Bauarbeiter zu haben.

bau_sandra1 = Du siehst nur eine BAUARBEITERIN, welche ziemlich schlecht gelaunt aussieht.
bau_sandra2 = Du siehst nur eine BAUARBEITERIN, welche an einem kleinen Computerchip arbeitet
bau_sandra3 = Du siehst nur eine BAUARBEITERIN, welche scheinbar in ihren Gedanken vertieft ist

bau_ranken = Außerdem siehst du ein loses ROHR, welches von losen KABELN und Ranken eingewickelt wurde
bau_keine_ranken = Außerdem siehst du ein loses ROHR, welches auf einem haufen loser KABEL liegt
bau_only_pipe = Außerdem siehst du ein loses ROHR, welches neben ein haufen durchgeschnittener Ranken liegt.
bau_only_kabel = Außerdem siehst du ein haufen durchgeschnittener Ranken und lose KÄBEL
bau_leer = Außerdem siehst du ein haufen durchgeschnittener Ranken. Die scheinen nicht von nutzen zu sein.

eingang_opening = Du betrittst den Eingangsbereich, eines Labors. Das Labor scheint wichtig zu sein.

eingang_l1 = Du starrst auf den Eingang des Labors, welcher in NORDEN.

eingang_bewacht = Vor dem Eingang steht ein WACHMANN, welcher dich nicht passieren lässt
eingang_benebelt = Vor dem Eingang liegt ein WACHMANN, welcher nicht ganz bei bewusstsein zu sein scheint
eingang_frei = Der Eingang scheint, frei und passierbar zu sein


labor_opening = Du betrittst das Labor. Du hast das Gefühl, dass hier deine Geschichte zu Ende gehen wird.

labor_l1 = Das Labor wurde von irgendjemanden auseinander genommen. Alles ist kaputt und wurde auf dem Boden geworfen.

labor_akte_medikamente = Dabei bemerkst du eine verstaubte AKTE und paar MEDIKAMENTE auf dem Boden
labor_akte = Dabei bemerkst du eine verstaubte AKTE auf dem Boden
labor_medikamente = Dabei bemerkst du ein paar MEDIKAMENTE auf dem Boden

labor_chip = Am auffälligsten ist allerdings der große Server, welcher an einen COMPUTER-CHIP angeschlossen ist.



beobachtet = Du fühlst dich beobachtet

sleep = Du legst dich ins Bett schlafen. Du hast '1' Leben geheilt

no_splep = Das ist nicht der richtige Ort zum Schlafen. Du solltest nachhause gehen, wenn du müde bist.