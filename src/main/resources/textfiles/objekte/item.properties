use_brief = Es ist ein Brief welcher an Arthur addresiert ist! Willst du diesen lesen?

take_chip = Du nimmst den Kaputten Computer-Chip aus dem Tresor heraus. Es scheint etwas sehr Besonderes zu sein!

take_stock = Du trittst den Hund zur Seite, um seinen Stock zu nehmen.

use_chip = Du versuchst den kaputten Computer-Chip zu verwenden! Er scheint kaputt zu sein!

use_chip_heile = Du benutzt den Computer-Chip! Er scheint keinen nutzen zu bringen, solange er an keinem Computer angeschlossen ist.

take_hund = Der Hund scheint dir verziehen zuhabe\nDu sagst dem Hund, dass er dir folgen soll. (Er zählt jetzt als Item in deinem Inventar)

use_hund = Du sagst dem Hund, er soll einen Trick machen. Er lässt ein Häufchen zurück.

take_jogurt = Du hast den halb aufgegessenen Joghurt erhalten. Du überlegst dir außerdem eine Nasenklammer zu kaufen

use_jogurt = Du isst den stinkenden Joghurt. Er schmeckt furchtbar und ist vermutlich seit längerer Zeit abgelaufen\nDu verlierst '5' Leben

take_haufen = Warum auch immer entscheidest du dich den Haufen, des Hundes auszusammeln...

use_haufen = Was genau hast du vor????

take_knopf = Du nimmst den Knopf, um die Glasscheibe zu öffnen

use_knopf_1 = Du drückst auf den Knopf.

use_knopf_2 = Die Glasscheibe öffnet sich und der CHIP liegt offen herum.

use_knopf_3 = Du hast das Gefühl, dass sich die Glasscheibe in der Farm geöffnet hat. Vielleicht ist aber auch etwas ganz anderes passiert

use_knopf_4 = Nichts passiert.
#0: heilung
use_medikamente = Du nimmst die Medikamente ein! Du heilst ''{0}'' Leben

take_kabel = Du schneidest die Ranken mit "{0}" durch und nimmst die Käbel, welche unter dem Metal Rohr liegen

take_pipe = Du schneidest die Ranken mit "{0}" durch und nimmst das Metal Rohr an dich

use_verkleidung = Du ziehst die Polizeikleidung an

take_schwert = Du willst dem Kind das Spielschwert abnehmen, aber es weigert sich dir das Schwert zu geben

take_substanz1 = Du nimmst die verbotene Pflanze aus der Box
take_substanz2 = Du erntest einen Strauß von der verbotenen Pflanze

take_tagebuch = Du hebst das staubige Tagebuch vom Boden auf

tagebuch_first_open = Du versuchst das Tagebuch zu öffnen und daraus zu lesen

tagebuch_abfrage = Allerdings scheint es verschlossen zu sein! Schreibe das Passwort, um es zu öffnen:

tagebuch_passwort_lösen = Du gibst das Passwort ein und kannst anfangen das Tagebuch zu lesen

take_scanner = Arthur hat dir den "Scanner" gegeben! Schreibe "Scan" um informationen von jemanden zu erhalten

use_scanner = Du kannst den Scanner mit dem Command "Scan" verwenden
#passwort
use_notiz = Du liest die Notiz und drauf steht:\n"Tagebuch Passwort: {0}"

take_glas = Der Glascontainer ist zu schwer für dich

take_ranken = Du versuchst die Ranken zu nehmen, aber sie sind reingewachsen.

take_box = Du willst die Box aufheben, aber sie scheint an den Tisch rangeklebt zu sein... wer kam auf die Idee die Box anzukleben? Man hätte sie doch einfach in den Schrank stellen können????

use_gold = Du inspizierst den Goldklumpen und realisierst, dass es einfach nur ein golden angemalter Stein ist!

take_reparierter_chip = Du erhältst den neuen und reparierten Computer-Chip!

take_bett = Du versuchst dein Bett mitzunehmen, aber du bist zu schwach! Vielleicht hättest du dir kein Doppelbett kaufen sollen

use_kabel = Du versuchst aus den Kabeln etwas zu bauen... du hast absolut keine Ahnung was du gerade versuchst!

reapier_computer_simple = Du nimmst die Käbel und reparierst damit deinen kaputten Computer.

use_kabel_extra = Er sollte jetzt wieder funktionieren!

take_computer = Du versuchst den Computer zu nehmen, aber er ist sehr unhandlich. Außerdem bringt er dir mehr, wenn er am Strom angeschlossen ist!

use_computer = Du versuchst den Computer zu starten, aber einige Kabel scheinen durchgeschmort zu sein

find_data = Du startest den Computer und gehst durch deine Ordner durch. Es scheint sehr leer zu sein, bis du Programmcode eines Computer-Chips findest. Du entscheidest dich diese auf einen USB-Stick zu laden.

use_plan = Du versuchst den Programmcode auf dem USB-Stick zu lesen. Ohne einen Bildschirm erweist sich dies, allerdings als sehr schwierig

take_server = Sei jetzt nicht alber! Wie stellst du dir vor, dass du den ganzen Server tragen kannst?

akte_take = Du hebst die verstaubte Akte vom Boden auf

akte_use = Du öffnest die Akte und siehst, dass da Informationen über 3 verschiedene Personen stehen.

akten_optionen = \nWelche Akte willst du lesen?\n1: Markus\n2: Sandra\n3: Ein Unerkennbarer Name\n4: Weg legen

akte_markus = Einer unserer ältesten Angestellten. Hauptverantwortlicher für das Design und Kompatibilität unseres "Happy Maker". Technisches Wissen, wie es kein zweiter hat, aber leider extremst faul. Wenn ihm keine Aufgabe gegeben wird, nutzt er das aus und versteckt sich auf dem Klo um nicht aufzufallen. Dazu kommt sein immer größer werdendes Drogen Problem. Allerdings ist sein technisches Wissen zu wertvoll um jemanden wie ihn zu entlassen.
akte_sandra = "Mamas Liebling", wie sie oft von ihren Angestellten genannt wird. Hauptverantwortliche, für das Verbinden von Code und Modell unseres "Happy Maker". Steigert die Arbeitsmoral, bei ständiger gute Laune. Auch wenn ihr Job leicht austauschbar wäre, will niemand auch nur darüber nachdenken sie zu feuern. Sie wirkt sehr gestresst, seitdem ihr Sohn im Kindergarten ist und versucht den Chip so schnell wie möglich fertig zu bauen.
akte_du = Unser neuestes Mitglied hier bei Utopus. Hauptverantwortliche für die Programmierung unseres "Happy Maker" und einer unserer engagiertesten Arbeitet. Ein riesiges Portfolio mit erfolgreichen Projekten, aber einfach zu frustrieren. Nimmt bei großen Problemen oft den einfachsten Weg, auch wenn dies die offensichtlich falsche Entscheidung ist.
akte_schließe = Du entscheidest dich die Akte wieder zu schließen.

final_start = Du bist kurz davor den Chip zu entfernen und die ganze Menschheit zu verändern. Das ist deine letzte Chance dich nochmal aufzurüsten, bevor du am Ende deiner Geschichte landest!\n1: Fortfahren\n2: Abbrechen

final_abbruch = Du entscheidest dich, erstmal noch nicht den Chip zu entfernen!

use_first = Du kannst Items mit "use/verwenden" benutzen



tagebuch_zwischenfrage = \nWillst du weiter lesen?\n1: Nächstes Kapitel\n2: Aufhören zu lesen
tagebuch_aufhören = Du schließt das Tagebuch und entscheidest dich später weiterzulesen


nicht_brief_lesen = Du entscheidest dich den Brief nicht zu lesen