scan = Eine sehr alte Dame. Sie hat nichts Besonderes an sich. Man könnte meinen Sie sei als Testobjekt hier platziert worden, damit man Kampfmechanics ausprobieren kann... aber das wäre ja grausam
kampfscan = Sie versucht ihre Kampftaktik originell zu gestalten. Sie wird wenig normale Angriffe machen und versuchen dich mit Gimmicks zu überraschen
final = Oh... Da hast du wohl etwas zu stark zugeschlagen... Aber keine Sorge... ich verzeihe dir... sag einfach meinem Enkel, dass ich ihn geliebt habe!

dialog0 = Hallo Mister, schau mal der süße Hund, der hier mit dem Stock spielt
dialog1 = Ich liebe die Natur! Ist die Welt nicht schön?
dialog2 = Hahaha die Jugend und ihr Sinn für Comedy. Ist die Welt nicht schön?
dialog3 = Ach wirklich? Sie haben wahrlich ein reines Herz! Ist die Welt nicht schön?
dialog4 = Als Kind dachte ich immer, dass Kämpfen eine sehr traurige Sache ist, doch dann hab ich mein eigenes Kampf dojo eröffnet und habe freude daran gefunden Menschen das Kämpfen beizubringen. Ich kann ihnen auch etwas kämpfen beibringen, wenn sie wollen
dialog100 = Da haben Sie wahrlich recht. Kommen Sie jederzeit zu mir, wenn sie wollen. Ich habe sehr viel Lebenserfahrung und kann ihnen bestimmt etwas beibringen, wenn sie wollen
dialog101 = Alles klar. Starte einfach einen KAMPF mit mir und dann können wir starten
dialog102 = Verständlich, es ist ewigkeiten her, dass ein Kampf hier stattfand, falls du dennoch etwas üben willst, kannst du einfach einen KAMPF mit mir starten
dialog103 = Ohja stimmt! Weißt du, als junge Frau hatte ich damals ein Kampf dojo und hatte sehr viel Spaß Menschen das Kämpfen beizubringen. Falls du willst, kannst du einen KAMPF mit mir starten und dann kann ich dir etwas beibringen!
dialog104 =Haha, das will ich erstmal sehen! Unterschätze niemals eine Frau mit sehr viel Erfahrung
dialog-1 = Ach du meine Güte du hast den Hund getreten...
dialog-2 = Der Kampf mit dir hat sehr viel spaß gemacht! Wenn du willst, kannst du deine neuen Fähigkeiten an mir austesten!

antwort1 = Das ist wahrlich ein süßer Hund
antwort2 = Ich werde den Hund treten
antwort3 = Sehr wohl! Die Welt ist sehr schön
antwort4 = Na ja es gibt auch sehr traurige Sachen auf der Welt
antwort5 = Etwas Kampftraining würde bestimmt etwas gut tun
antwort6 = Ich glaube, ich brauche kein Training, trotzdem danke für das Angebot
antwort7 = Er wollte getreten werden. Ich hab ihn nur seinen Wunsch erfüllt
antwort8 = Das war nicht ich, sondern jemand der 1 zu 1 so wie ich aussieht
antwort9 = Ich werde dich zerstören!
antwort10 = Ich werde dich fertig machen!
antwort11 = Ich werde dich vernichten!
antwort12 = Ich werde dich so zerstören, dass du nicht mehr weißt was vorne und hinten ist
antwort13 = Du meintest, du kannst mir etwas beibringen

kampfstart = Du willst also lernen zu kämpfen!!!!! Das ist sehr gut! Eine gute Kampftechnik kann dir sehr oft im Leben weiterhelfen. Fangen wir erstmal mit dem Standard Angriff an. SCHLAG MICH!
pre_kampf_start = Du willst mit mir kämpfen? Was ein Zufall! Ich habe damals ein Kampf dojo geleitet, wenn du möchtest, kann ich dir etwas beibringen, wie man kämpft!
kampf_ja = Ja ich würde gerne lernen, wie man Kämpft
kampf_nein = Ne, ein anderes mal vielleicht
kampfAbgelehnt = Ok dann vielleicht ein anderes Mal! Starte gerne wieder einen KAMPF mit mir, falls du dich umentschieden hast!
action1 = Angreifen
kampf1 = Perfekt! Das war gut, aber um einen Kampf zu gewinnen braucht es etwas mehr. Zum Beispiel mit deiner zweiten Attacke: Ein aufgeladener Angriff. Greif mich mit einem aufgeladenen Angriff an!
action2 = Aufgeladenen Angriff
#0: cooldown
kampf2 = Autsch! Sehr gut! Aufgeladene Angriffe machen mehr schaden, aber müssen danach {0} Runden wieder aufladen. Allerdings hat dein Gegner auch normale und aufgeladene Angriffe. Aber keine Sorge mein Kind, diese kannst du einfach mit einem Block abwähren
action3 = Blocken
frage1 = Wie viel stärker ist ein aufgeladener Angriff?
erklärung1 = Ein aufgeladener Angriff macht das dreifache eines normalen Angriffes. Mit einem Block kannst du allerdings den schaden verhindern oder verkleinern. Probier es mal aus
kampf3 = Bravo! Du hast den Schaden abgewährt. Eine aufgeladene Attacke ist zwar stark, aber sie hat eine Schwäche. Dein Gegner braucht immer zwei Runden dafür. Eine zum Aufladen und eine zum Angreifen. Nutze das, um anzugreifen
frage2 = Kann man trotz eines Blocks trotzdem schaden bekommen?
frage3 = Woran erkenne ich, dass der Gegner eine Attacke auflädt?
erklärung2 = So was kann durchaus passieren. Beim Block einer normalen Attacke, bekommst du zwar keinen Schaden, aber der Block einer aufgeladenen Attacke reduziert den dreifachen Schaden und macht den zu einfachem schaden! Aber du kannst das auch nutzen, um anzugreifen
#0: Text.get(OrtText.NPC, "vorbereiten", name)
erklärung3 = Sehr gute Frage! Im Textfeld steht normalerweise immer welche Attacke dein Gegner macht, aber wenn er dabei ist eine Attacke aufzuladen steht im Textfeld "{0}". Dabei wird dir keinen Schaden gemacht und du kannst ohne Probleme angreifen!
action4 = *Tanzen*
kampf4 = Da bist du grad auf einen Trick reingefallen. Wenn dein Gegner etwas vorbereitet kann dies zwei verschiedene Sachen heißen. Entweder lädt er einen Angriff auf oder baut eine Falle auf! Eine Falle anzugreifen resultiert darin dir selber schaden zu machen, aber eine aufgeladene Attacke kann diese kaputt machen
frage4 = Wie viel Schaden macht eine Falle?
frage5 = Woran erkenne ich ob der Gegner eine Falle stellt oder eine Attacke auflädt
meme_antwort = Ich muss dich leider enttäuschen! Wenn du blockst (oder in diesem Falle tanzt) wird die Falle nicht verschwinden.
erklärung4 = Bei einer Falle macht dein Gegner keinen Schaden, sondern nur du dir selber. Also bekommst du so viele Schadenspunkte wie du sonst machen würdest. Mit einer aufgeladenen Attacke kannst du allerdings die Falle kaputt machen
#0: Text.get(OrtText.NPC, "vorbereiten", name)
erklärung5 = Das ist eine sehr, sehr gute Frage und hier wird es nämlich interessant. In beiden Fällen steht im Textfeld: "{0}" und du musst entscheiden, ob es sich lohnt zu blocken oder ob du einen Angriff wagst. Gerade baue ich eine Falle auf, also versuch es mal mit einem aufgeladenen Angriff
kampf5 = Perfekt! Der Schaden wird durch die Falle zwar dennoch reduziert. Allerdings machst du dem Gegner immer noch mehr schaden als durch einen normalen Angriff. Und das ist eigentlich alles was es zu wissen gibts! Hast du noch Fragen?
keine_frage = Nein, du hast alle Fragen beantwortet. Danke sehr!
frage6 = Was meinst du mit mein Schaden wird reduziert?
frage7 = Wie weiß ich welche Attacken mein Gegner machen wird?
erklärung6 = Normalerweise macht dein aufgeladener Angriff das Dreifache an Schaden. Wenn du allerdings damit in eine Falle reinrennst, geht die Falle kaputt und du machst statt dreifachen, nur noch den doppelten an Schaden. Gibt es sonst noch irgendwelche Fragen?
erklärung7 = Tatsächlich hat jede Person einen anderen Kampfstyle. Der Man da vorne besitzt tatsächlich einen "${save.scanner.name}", welcher dir Tipps geben kann, wie dein Gegner kämpft. Vielleicht leiht er ihn dir aus, falls du höflich fragst!
final_kampf = Ich hoffe, ich konnte dir weiter helfen. Wenn du dein Wissen testen willst, dann kannst du dein neues Wissen in einem KAMPF mit mir unter beweis stellen. Aber pass auf! Unterschätze niemals eine Alte Frau