scan = Vor vielen Jahren schien er ein Genie gewesen zu sein. Er half bei der Erschaffung eines Chips, welcher in das Gehirn gepflanzt werden kann. Über die Jahre vergass er alle seine Erinnerungen, aber er hat trotzdem herausgefunden, dass es eine Pflanze gibt, welche den Chip kurzzeitig deaktiviert. Seitdem sehnt er sich nur noch dieses Gefühl wieder und wieder zu erleben.

kampfscan = Er scheint sehr agressiv und brutal zu kämpfen, allerdings scheint sein ständiger Pflanzenkonsum seinen aufgeladenen Angriff zu schwächen
#0: Arthur
final = Warum... warum tust du das... ich dachte, wir wären Homies {0}... und das, nachdem ich dir den Scanner gebaut habe... du hattest die Kraft alles zu wissen und nutzt die Kraft gegen mich ein

