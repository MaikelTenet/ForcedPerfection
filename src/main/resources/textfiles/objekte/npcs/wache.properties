scan = Ein starker Man! Wenn niemand in der Nähe ist, macht er Liegestützen bis zum Muskelversagen und noch 30 mehr, ohne einen tropfen Schweiß zu verbrauchen. Der perfekte Man, den man auf seiner Seite haben will.

kampfscan = Er benutzt keine Waffe, aber besitzt pure Muskelmasse. Er kämpft nicht sehr strategisch, sondern haut einfach drauf bis er gewonnen hat.

final = Was auch immer du vorhast... Lass es sein... du weißt nicht, was du auslösen wirst

begrüssung = Bitte drehen Sie um, hier ist der zugang nicht gestattet.
musst_nicht = Das würde ich an deiner Stelle nicht versuchen! Das ist ein Hochsicherheitsgebäude, du weißt nicht, wo du versuchst hier reinzukommen
kein_bug = Guter Versuch jungspund, aber mir wurde nichts von einem Bug erzählt. Da musst du schon was Besseres finden!
nicht_bestechbar = Du willst mich bestechen? Sorry, aber ich bin nicht bestechlich egal was du versuchst!

warum_hier = Warum bewachst du diesen Ort?
bewachen_antwort = So ein Typ meinte, ich darf unter keinen Umständen jemanden hier durch lassen. Ich weiß nicht, was hinter dieser Wand ist, aber er bezahlt gut, also hinterfrage ich es nicht.

ich_muss = Ich muss hier durch, das Schicksal der Welt hängt davon ab
berechtigung = Mir wurde gesagt ich muss hier rein, weil ich einen Bug fixen muss
was_wollen = Was muss ich machen, damit du mich durchlässt!

kochen = Ich kann dir etwas kochen!
kochen_antwort = Hahaha ich liebe ein gutes Schnitzel mit, einer guten Jägersoße! Aber da wirst du schon mehr brauchen als ein gutes Gericht
tanzduell = Lass ein Tanzduell machen und wenn ich gewinne, kommst du durch!
tanz_antwort = Ich habe 14 auszeichnungen in Tanzduellen. Mit mir willst du dich nicht anlegen
rätsel = Ich gebe dir ein Rätsel und wenn du es nicht lösen kannst, musst du mich durchlassen
rätsel_antwort = Das können wir machen, aber pass auf, ich bin sehr gut in Rätsel lösen!
pflanze = Ich kann dir eine Pflanze geben, welche einen speziellen Effekt gibt
pflanze_antwort = Du... du hast Zugriff zu der verbotenen Pflanze??? Ich hab schon soviel von der gehört, aber ich dachte, nicht dass es diese wirklich gibt. Bring sie mir und ich lasse dich hier durch!
massieren = Ich kann dir eine Massage anbieten!
massieren_antwort = Das ist ein gutes Angebot. Allerdings ist ein Teil meiner Bezahlung, dass mir jede Woche eine gratis Massage gegeben wird und die werde ich nicht riskieren

rätsel1 = Was ist 453 x 2932?
rätsel1_antwort = Kopfrechnen ist kein Problem! Die Antwort ist 1.328.196! Frag mich was Schwereres
rästel2 = Wie viele Bananen kann ein Mensch essen, bis er an einer radioaktiven Vergiftung stirbt!
rätsel2_antwort = Ab einer Menge von 10 Millionen Bananen die Sekunde besteht die Gefahr zu viel Strahlung aus den Bananen zu dir zu nehmen! Frag mich was Schwereres
rätsel3 = Was hab ich zuletzt gegessen?
rätsel3_antwort = Mein erster Gedanke als ich dich sah war, dass du auf jeden Fall vorhin einen Joghurt gegessen hast!

ideen_leer = Mir sind die Ideen ausgegangen, wie ich dich bestechen kann...
ideen_geben = Tja, dann hast du wohl nichts um mich zu bestechen. Such weiter! Ich bezweifel, dass du hier etwas findest wirst, um mich zu bestechen, aber bleib naive.



begrüssung_gewächs = Hey, du! Hast du die Pflanze? Dann kann ich dich hier durch lassen!
beeilen = Alles klar! Denk dran, keine Pflanze kein durchtritt
warum_hintergehen = Ich habe sehr viel über diese mysteriöse Pflanze gehört und immer wurde mir gesagt, dass diese pures Tabu ist. Nach ewigkeiten, wo dir etwas verboten wird, willst du irgendwann mal wissen, was dahinter ist!
pflanze_bekommen = Du hast sie? Unglaublich! Dass ich diese jemals in meine Finger bekommen könnte! Ich fasse es nicht. Danke sehr jungspund. Pass allerdings auf nichts darin anzufassen!

hinterfragen = Warum willst du unbedingt diese Pflanze?
holen = Ich hole es direkt
pflanze_besitz = Ich habe, die Pflanze die du wolltest!


begrüssung_high = Jungspund hilfe! Die Pflanze macht mich fertig!

fragen = Wie fühlst du dich gerade?
furchtbar = Ich fühle mich furchtbar. Alles schmerzt und ich fühle mich extremst unwohl! Ich liebe es. Ich habe seit Jahren nicht mehr dieses Gefühl gespürt. Ich habe bereits vergessen, wie sich schmerz, anfühlt.

denken = Woran denkst du gerade?
kopf_klar = Meine Gedanken sind so stark gerade, dass ich nicht mal weiß, woran ich denke. Ich hab das Gefühl, ich sehe wieder zum ersten Mal. Alles, was ich davor gesehen habe, wirkt für mich nicht echt. Es wirkt, als wäre ich das erste Mal wieder ich selber!

erinnerungen = Kannst du dich erinnern, wer dir von der Pflanze erzählt hat?
keine_erinnerungen = Ich erinnere mich an gar nichts. Das letzte was ich gerade noch weiß, ist, dass du mir diese Pflanze gegeben hast. Ich weiß nicht, warum du das gemacht hast oder warum ich das wollte. Mich würde es nicht wundern, wenn diese Erinnerung jeden Moment auch verschwinden würde!

wache_angriff_high = Digga greifst du mich grad an? Ich bin grad so fertig, lass mich bitte in Ruhe...