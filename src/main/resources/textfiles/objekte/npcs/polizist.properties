scan = Ein sehr enthusiastischer Polizist. Über die Jahre wurden alle seine Kollegen und vorgesetzten gekündigt, weil es keine Aufgaben mehr gab. Seine einzige Aufgabe ist es jetzt drauf zu achten, dass sich diese Pflanzen nicht verteilen... aber wenn jeder andere gefeuert wurde, wer hat ihn dann die Aufgabe gegeben?

kampfscan = Er hat für einen Polizisten sehr wenig kampferfahrung, aber achtung durch seine Kanone macht er sehr viel schaden. Er braucht allerdings immer etwas zum Zielen.
final = Wow... da hab ich aber mein Job sehr schlecht gemacht...

begrüssung = Hallo, werter Zivilist! Wie kann ich ihnen heute helfen!
begrüssung_freund = Hallo Kamerade! Was gibt es Neues?!
verabschieden = Ich freue mich, dass ich Ihnen helfen konnte!

bewerbungsverfahren = Na klar, senden sie uns einfach ihren Lebenslauf und ihr Führungszeugnis ein und wir melden uns in 3-4 Werkjahren wieder bei Ihnen! Ich und mein Kollege die VERKÄUFERIN, werden uns freuen.
sünden_annehmen = Also... ähm, das ist eigentlich keine Kirche, aber... welche Sünden haben sie den begangen?

keine_sünden = Das ist sehr gut! Ich hatte kurz Angst, dass ich Sie verhaften muss hahaha
hund_lösung = Also... oh das ist nicht sehr gut... wissen Sie was! Gehen Sie rüber zum Hund und spielen Sie etwas Stöckchen mit ihm. Er wird Ihnen bestimmt verzeihen.
ko_lösung = Das ist aber nicht sehr gut, dafür müsste ich Sie eigentlich verhaften! Das mache ich direkt... sobald Sie... also... ich weiß tatsächlich nicht wie ich Menschen verhafte... Versprechen Sie mir einfach das nicht nochmal zu machen und ich lasse Sie frei
lügner_lösung = Sie sind ein Hochstapler???? Aber Sie scheinen keine bösen Intentionen zu haben... Wissen Sie, ich habe mir schon länger einen Arbeitskollegen gewünscht. Ich glaube, das kann noch eine schöne Freundschaft werden.
weed_lösung = Oh das haben Sie tatsächlich... wenn ich ehrlich bin, weiß ich nicht mal warum diese Pflanze verboten ist. Sie scheint sehr ungefährlich zu sein. Ich frage mich was Sie so besonders macht?
schlagen_lösung = HAHA ja das haben Sie tatsächlich! Aber keine Sorge, ich bin Polizist. Ich kann so was ab!
mein_sinn = Das ist wohl wahr. Ich würde gerne behaupten, dass es meine Schuld ist, dass es hier keine Verbrechen gab, aber das ist leider nicht wahr haha. Momentan habe ich nur den Auftrag, dass diese Pflanze sich nicht verbreitet und mehr brauche ich nicht um zufrieden zu sein.
weed_zivi = Oh das kann ich leider nicht machen. Ich habe die Aufgabe bekommen, dass absolut niemand an diese Pflanze rankommen darf. Tut mir echt leid, ich hoffe, Sie können es verstehen
weed_poliz = Hmmm, also eigentlich hab ich die Aufgabe bekommen, dass absolut niemand diese Pflanze in die Hände bekommen darf... allerdings bist du auch ein Polizist, also falls du sie rausnehmen würdest, könnte ich nicht sehr viel dagegen tun.
kanone_verlangen = Du... du willst meine Waffe? Aber warum?

selbstverteidigung_antwort = Oh, das klingt natürlich logisch, aber ich glaube, es wäre besser, wenn du deine eigene Waffe bekommst. Du kannst ein Formular ausfüllen und innerhalb der nächsten paar Jahre solltest du die bekommen
gefeuert_antwort = Oh, das ist aber traurig... kann ich mein Kündigungsschreiben sehen? Mich interessiert der Grund, weshalb ich gekündigt... warum gehst du weg... komm zurück!
erschießen_antwort = Oh das ist, glaube ich nicht sehr Legal. Ich glaube, ich kann in legale Probleme kommen, wenn ich Ihnen, bei dieser Tat helfe, weshalb ich es lieber sein lasse.
gesetz_antwort = Oh das ist natürlich ein fairer Punkt. Allerdings steht im Absatz 5 Unterpunkt K, dass wenn die Dienstwaffe seit mehr als 10 Jahren im besitz, eines Angestellten ist, dass er diese Abgabe verweigern kann.
mitleid_antwort = Oh... das tut mir, aber leid... erzähl das niemanden, aber du kannst meine Waffe haben... ich habe die eh seit 5 Jahren nicht mehr verwendet, also brauche ich die auch nicht
vierte_wand_antwort = Oh, das ist aber sehr traurig die realisation, dass ich nicht echt bin. Allerdings, will ich das Spiel dann auch nicht zu einfach machen. Wenn ich mich weigere dir die Waffe zu geben, musst du eine andere Methode finden und die Playtime steigt
gaslight_antwort = Oh wirklich, das tut mir, aber leid. Ich habe da leider meinen Namen "Polizeiwache 8" eingraviert. Ich verspreche dir, ich besorge mir eine brandneue Pistole, die ich dir schenken werde.
reality_antwort = Oh werde ich wirklich? Hm ich hab das Gefühl, ich sollte mich dann weigern dir diese Pistole zu geben. Der Chip, wäre bestimmt nicht glücklich, wenn ich ihn helfen würde ihn aufzuhalten.

bewerben = Ich würde mich gerne zu einer Stelle als Polizist bewerben!

kanone_wollen = Ich möchte deine Pistole haben!
selbstverteidigung = Ich bin neu hier und mir wurde gesagt, du sollst mir deine Waffe geben
gefeuert = Du wurdest gefeuert und ich bin dein neuer Ersatz
erschießen = Ich will paar Menschen damit erschießen
gesetz = Laut Absatz 3, Unterpunkt B des Arbeits-gesetzbuchs für spontane Waffenübergaben bist du verpflichtet, mir die Dienstwaffe auszuhändigen.
mitleid = In der Ausbildung wurde mir nie eine eigene Waffe anvertraut. Ich würde alles tun um eine mal halten zu können
vierte_wand = Du bist nur ein NPC in einem Spiel. Wenn du sie mir nichts gibst, schalte ich das Spiel ab.
gaslight = Das ist doch meine Waffe! Ich habe sie dir doch nur ausgeliehen.
reality = Du wirst von einem übernatürlichen Computer Chip gesteuert! Wenn du mir deine Waffe gibst, kann ich dich retten.

verbrecher = Ich möchte meine Sünden beichten!
sinn = Was machst du überhaupt? Hier gab es seit Jahren kein Verbrechen mehr.
weed_bekommen = Kann ich die Pflanze da vorne bekommen?

hund = Ich habe einen Hund getreten!
ko = Ich habe eine Person ko geschlagen!
lügner = Ich bin gar kein Polizist. Ich habe diese Verkleidung erkauft.
weed_geklaut = Ich habe mir die Pflanze da vorne, ohne berechtigung rausgenommen.
sünden_abbrechen = Ich habe tatsächlich gar keine Verbrechen begangen
dich_geschlagen = Ich habe dich grad eben geschlagen!


