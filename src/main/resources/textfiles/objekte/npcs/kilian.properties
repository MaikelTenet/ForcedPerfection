scan = Ein Kind welches scheinbar viel zu alt für diesen Kindergarten ist. Er hat viele Narben und blaue Flecken, weil er ständig geschlagen wird. Es scheint, als ob er alle Schmerzen fühlen kann, aber diese werden in seinem Kopf direkt mit positiven Gefühlen überschrieben, damit er nicht realisiert, dass er schmerzen spürt

kampfscan = Er denkt, dass das nur ein kleiner Spaßkampf ist ohne Konsequenzen. Demnach wird er oft versuchen dich zu fangen, damit du ihn nicht weglaufen kannst.

final = Uff, das war ein spaßiger Kampf... lass das irgendwann nochmal wiederholen...

dia_freundsein = Hey du! Willst du mein Freund sein?
dia_freund_statt_schwert = Du willst mein Schwert haben? Wir kennen uns doch gar nicht! Lass Freunde werden!
dia_freund = Du willst wirklich mein Freund sein??? JUHUUU keiner der anderen Kinder will mit mir befreundet sein
dia_feind = Okay, das ist in Ordnung! Irgendwie will keiner der anderen Kinder mit mir befreundet sein... aber das ist schon in Ordnung, immerhin hab ich mein Schwert hier!
dia_whynofriends = Die anderen Kinder haben mehr spaß mich zu zwicken und zu treten, aber ich hab kein Problem damit! Ich bin Teil des spaßes und das macht mir spaß. Außerdem hab ich Spaß mit meinem Schwert!
dia_spiel_spielen = Oh ja ich LIIIIIEBE Spiele! Ich warte dann hier auf dich, bis zum Ende des Spiels!
dia_verabschieden = Okay! War schön wieder mit einer Person zu sprechen
dia_schwerverhandeln = Hmmm du willst mein Schwert haben? Das ist eigentlich das einzige, was ich besitze... aber wenn du mir einen kleinen Gefallen erwidern könntest dann könnte ich es dir schenken.
dia_hilfe_bei_freunden = Du willst mir helfen Freunde zu finden? Das wäre sehr cool! Ich würde dir sogar mein Schwert dafür geben können!
dia_freund_wiedersehen = Hallo Freund! Schön dich wiederzusehen!
dia_feind_wiedersehen = Hallo Nichtfreund! Schön dich wiederzusehen!
dia_quest = Ich versuche immer mich mit dem MÄDCHEN da hinten anzufreunden! Ihr Name ist Lisa. Wenn du es schaffst, dass sie mit mir befreundet sein will, dann bekommst du mein Schwert!
dia_keinequest = Okay, dann nicht. Dann bleibe ich alleine!
dia_frage_nachquest = Wie sieht es aus? Hast du Lisa schon überzeugt mit mir befreundet zu sein?
dia_lisa_hilfe = Keine Ahnung... ich weiß nur über sie, dass sie gerne Menschen weh tut (hauptsächlich mir)... Mit ihr befreundet zu sein würde bestimmt helfen eine Freundschaft mit ihr zu schließen...
dia_schwert_origin = Meine Oma hat mir damals das Schwert geschenkt. Immer wenn ich es sehe erinnert mich das an die
dia_aufwiedersehen = Okeee, viel Erfolg dir noch!
dia_geschichte_positiv = Das ist schon in Ordnung. Führ, mich macht das keinen Unterschied, ob die mich treten oder ignorieren. Immer beachten sie mich
dia_geschichte_negativ = Das ist witzig. Die Erzieher haben genau das Gleiche gesagt. Mein Vater meinte einst, dass sich die Erzieher auch an Regeln halten sollen, aber niemand beschwert sich, dass Regeln gebrochen werden, also gibt es dafür auch keine Konsequenzen
dia_geschichte_omatod = Oh wirklich? Das ergibt keinen Sinn... wortwörtlich ich weiß nicht, was das Wort "Tod" heißt!
dia_mission_erfolgreich = Du hast es wirklich geschafft! Lisa will mit mir abhängen yeayyyy!
dia_scjwert_abgeben = Ach so stimmt. Hier das kannst du jetzt haben. Ich hab ja jetzt eh Freunde, also brauche ich das nicht mehr!
dia_lisa_befreundet = Mit Lisa abzühängen macht soviel spaß! Sie beißt mich zwar sehr oft, aber immerhin macht sie was mit mir!
dia_wegstecken = Das werde ich machen! Sie ist mein erster Freund, den ich jemals hatte. Ich werde aufpassen, diese Freundschaft nicht kaputt zu machen.
dia_nicht_wegstecken = Ne, musst dir keine Sorgen machen. Ich weiß, dass mir so was eigentlich schmerzen bereiten sollte, aber warum auch immer tut mir das ganze nicht weh und macht mich sogar etwas mehr glücklicher!

freund_werden = Ja lass Freunde werden!
feind_werden = Nein ich hasse dich!
schwert_unhöfflich = Gib mir dein Schwert!
nofriedn_frage = Warum wollen die anderen Kinder nicht deine Freunde sein?
spiel_spielen = Lass ein Spiel spielen. Ich gehe und du bleibst hier stehen
gehen = Ich gehe dann jetzt!
schwer_nett = Kann ich dein Schwert haben?
mitleid = Du armes kleines Kind du tust mir leid. Kann ich dir helfen Freunde zu finden?
auslachen = Haha zurecht. Bei deinem Aussehen wundert es mich nicht. Jetzt gib mir dein Schwert
annehmen = Ich kann dir helfen!
ablehnen = Finde selber Freunde, ich hab dafür keine Zeit!
hilfe = Wie kann ich Lisa dazu bringen dich zu mögen?
schwert_herkunft = Woher hast du das Schwert?
nicht_fertig = Noch nicht! Ich mache das jetzt!
schön = Das ist aber schön, schade, dass du dein Schwert mit niemandem teilen kannst.
langweilig = Das ist ja langweilig. Deine einzigen Freunde sind deine Oma? Das ist peinlich!
tod = Deine Oma ist Tod!
schwert_höfflich_final = Kann ich dann jetzt dein Schwert haben?
männlich = Die bisse musst du wegstecken können, du bist ein MANN!
etwas_gegen_sagen = Sag ihr, dass dich die bisse stören

schwert_direkt_nehmen = Du nimmst das Schwert von Kilian, ohne ihn vorher zu fragen