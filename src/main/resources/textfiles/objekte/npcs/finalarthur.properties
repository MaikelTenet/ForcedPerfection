kampfscan = Er scheint sehr strategisch zu kämpfen, er hat einen sehr aggressiven Angriff, aber versucht dich mit defensiven verhalten vom Weg abzuhalten.

begrüssung_fremd = Du bist mir bereits ins Auge gefallen. Ich dachte mir schon, dass mit dir irgendwas faul ist.
begrüssung_freund = Und da hab ich wirklich gedacht, dass ich wirklich einen Verbündeten hätte, aber trotz freiem Willen bist du wie jeder andre
begrüssung_skeptisch = Es war so klar. Seitdem du den Scanner wolltest, wusste ich, dass du irgendwann mal hier herkommen würdest.

hinterfragen = Was machst du hier?
hilfe_fragen = Kannst du mir helfen, diesen Chip zu deaktivieren!

hinterfragen_antwort = Genau das Gleiche wollte ich dich auch grad eben Fragen? Was glaubst du was passiert? Bist du dir bewusst, was du hier machst???
hilfe_ablehnen = Diese dreistigkeit lässt sich echt nicht mehr überbieten! Was glaubst du was passiert? Bist du dir bewusst, was du hier machst???

ja = Ja
nein = Nein

keine_erklärung = Ich habe gehofft, dass du klüger als das wärst... Andererseits war ich damals genauso wie du! Ich habe eine lange Reise hinter mir um zu realisieren wie wichtig dieser Chip ist! Lass mich dir meine Geschichte erzählen!
erklärung = Dann hör sofort damit auf! Ich habe eine lange Reise hinter mir um zu realisieren wie wichtig dieser Chip ist! Lass mich dir meine Geschichte erzählen!

erzählen = Erzähl mir deine Geschichte
nicht_erzählen = Mich interessiert deine Geschichte nicht!

will_erzählen = Du... du willst meine Geschichte nicht hören? Es ist eine interessante Geschichte! Bist du dir ganz sicher?

sicher = Ja ich will deine Geschichte nicht hören
nicht_sicher = Ich will die Geschichte doch hören!
geschichte1 = Ich erinnere mich nicht mehr wie sich mein Chip deaktiviert hat. Ich weiß nur noch, dass ich eines Tages bemerkt habe, dass ich anders als alle anderen bin. Jeder hat sich seltsam verhalten. Ich hatte nur ein einziges Ziel! Finde den Ursprung und vernichte ihn!
so_wie_ich = Also wolltest du auch den Chip vernichten?
verständnis = Dann kannst du mich doch verstehen!
geschichte2_1 = Das wollte ich für wahr. Ich habe für eine lange Zeit diesen Ort hier gesucht, um diesen Chip zu vernichten. Doch je mehr ich mit den Menschen gesprochen habe, desto mehr hab ich realisiert, dass sie glücklich sind. Keine schmerzen, keine Morde, keine Probleme! Ich habe realisiert... die Menschheit verdient es nicht freien Willen zu besitzen!
geschichte2_2 = Ich kann dich besser verstehen als jeder andere. Ich habe für eine lange Zeit diesen Ort hier gesucht, um diesen Chip zu vernichten. Doch je mehr ich mit den Menschen gesprochen habe, desto mehr hab ich realisiert, dass sie glücklich sind. Keine schmerzen, keine Morde, keine Probleme! Ich habe realisiert... die Menschheit verdient es nicht freien Willen zu besitzen!
freien_willen_verdienen = Du kannst doch nicht entscheiden, ob ein Mensch freien Willen verdient, oder nicht?
nicht_happy = Man kann doch nicht glücklich sein, wenn man nicht die eigene Kontrolle hat.
geschichte3_1 = Manchmal weiß jemand anderes was besser für dich ist, als du selber! Weißt du, wie die Welt vorher aussah? Kriege, Morde, vergewaltigungen, jeder denkt nur an sich selbst. Niemand denkt an die anderen. Doch dieser Chip! Dieser Chip hat eine Fehlfunktion! Menschen handeln nach Instinkt und nichtmehr nach wahl. Sie wurden zu den PERFEKTEN Menschen!
geschichte3_2 = Was eine simple Art aufs Leben zu schauen! Weißt du, wie die Welt vorher aussah? Kriege, Morde, vergewaltigungen, jeder denkt nur an sich selbst. Niemand denkt an die anderen. Doch dieser Chip! Dieser Chip hat eine Fehlfunktion! Menschen handeln nach Instinkt und nichtmehr nach wahl. Sie wurden zu den PERFEKTEN Menschen!
nicht_richtig = Warum sollte man PERFEKT sein, wenn niemand da ist um es zu bemerken!
unkonsistent = Was ist mit dir? Warum darfst du deinen Chip aktiviert haben?
geschichte4_1 = Haha vielleicht bist du doch nicht so naiv wie ich dachte. Aber in einer perfekten Welt, gibt es immer eine Person, welche zurückbleibt. Ich opfere mein Leben! MEINE UTOPIE! Ich opfere mich selber auf, damit diese PERFEKTE WELT bestehen bleiben kann! Ich bestehe und beschütze das glück jedes anderen! Und mein einziger Dank ist, dass ich diese Welt beobachten kann.
geschichte4_2 = Ich bin die einzige Person, welche hier verliert! Ich opfere mein Leben! MEINE UTOPIE! Ich opfere mich selber auf, damit diese PERFEKTE WELT bestehen bleiben kann! Ich bestehe und beschütze das glück jedes anderen!
ausrede = Das ist eine faule Ausrede, damit du deinen Willen behalten kannst.
nichts_opfern = Du hast keine Begründung dich zu opfern! Diese Welt würde auch ohne dich funktionieren!
geschichte5_1 = Ich würde alles tun, um diese Aufgabe abzugeben, aber es ist einfach zu riskant. So oft kamen freie Menschen wie du hier vorbei, welche alles beenden wollten. Ich habe Leute beauftragt, die diesen Ort bewachen. Ich baute einen Scanner, um alles im Blick zu halten. Ich habe jedes auffällige verhalten beobachtet und musste so viele Erinnerungen löschen, von Leuten die zu viel wussten. Einige vergassen sogar ihren eigenen Namen!
geschichte5_2 = Wenn du wüsstest, wie oft ich diese Welt retten musste. So oft kamen freie Menschen wie du hier vorbei, welche alles beenden wollten. Ich habe Leute beauftragt, die diesen Ort bewachen. Ich baute einen Scanner, um alles im Blick zu halten. Ich habe jedes auffällige verhalten beobachtet und musste so viele Erinnerungen löschen, von Leuten die zu viel wussten. Einige vergassen sogar ihren eigenen Namen!
krank = Dein Verhalten ist krank, diese Menschen verdienen es frei zu sein!
arbeit = Soviel Arbeit, für was? Für eine Welt die niemand genießen kann?
geschichte6_1 = Die Menschheit hat bewiesen, dass sie es nicht schaffen kann eine perfekte Welt zu erschaffen! Nenn mir eine einzige Sache, an dieser Welt die nicht PERFEKT ist!
geschichte6_2 = Wenn die Menschen wüssten, wo sie drinnen sind, würden sie mir danken! Nenn mir eine einzige Sache, an dieser Welt die nicht PERFEKT ist!
ignorant = Du bist so ignorant! Du willst einfach nur die Welt wieder so haben wie es dir egoistisches Schwein am liebsten ist! Nenn mir eine einzige Sache, an dieser Welt die nicht PERFEKT ist!
kein_glück_ohne_trauer = Wenn man dauernd nur glück verspürt ohne wahre konsequenzen, dann ist das Glück bedeutungslos
kinder = Ich habe Kinder gesehen welche sich gegenseitig geschlagen und verletzt haben.
freie = Ich traf eine Person, deren Chip nicht funktioniert hat. Diese Menschen verstehen nicht die Welt in der Sie Leben.
scam = Es gab einen Magier, welcher mit falschen Goldklumpen die Menschen abgezogen hat.
drug_addict = Ich habe einen Drogenabhängigen gesehen, wie kann das Teil deiner UTOPIE sein?
schuldgefühl = Ich hatte riesige Schuldgefühle fürs Erschaffen dieser Chips, aber konnte mich nicht schlecht fühlen
erinnerungen_verlieren = Jeder verliert nach ner Zeit seine erinnerung und jede Freude ist nur vorübergehend.
kämpfen = Du belügst dich nur selbst, wenn du nicht akzeptieren kannst, dass diese Welt fehlerhaft ist.

kein_glück_antwort = Das ist dein einfaches Denken, weil du nicht weißt wie es sich wirklich anfühlt. Sobald du diese Freude verspürst, wirst dein eigener Gedanke keinen Sinn mehr machen.
kinder_antwort = Kinder haben sich vorher auch geschlagen und gefetzt! Die verletzungen sind schlecht, aber der Chip hat eine spezielle Funktion bei Ärzten, dass sie verletzungen ernst nehmen. So konnte ich übrigens auch sicherstellen dass, jedes Neugeborene direkt ein Chip bei der Geburt erhält.
freie_antwort = Diese Menschen werden früher oder später zu mir kommen. Sie werden dieselbe Intention haben wie du, aber ich kann Sie retten. Ich habe jeden Chip neu gestartet und habe jeden gerettet. Das ist mein Ziel als Bewacher der Utopie.
scam_antwort = Das Konzept des "Betrugs" ist Menschengemacht. Wenn es niemanden gibt, der etwas verliert, was ihm bedeutet, gibt es nichts das wirklich verloren wurde
drug_antwort = Markus ist eine Ausnahme in diesem Scenario. Ein Kraut, welches den Chip kurzzeitig reaktiviert. Und dennoch ist dies nur eine Form seiner eigenen Utopie! Er entscheidet sich freiwillig dazu und schadet dabei nicht mal seinen eigenen Körper.
schuldgefühl_antwort = Du beschwerst dich, aber ich sehe keine Probleme. Du sagst es selber, du hattest keine Schuldgefühle! Du warst nicht traurig und das ist was zählt!
lost_memory_antwort = Erinnerungen sind Vergangenheit! In dieser Welt brauchen wir keine Erinnerungen. Niemand wird sich an irgendwas erinnern und weißt du was. NIEMANDEN JUCKTS! Weil jeder Moment besonders ist und niemand etwas hinterher trauert.


final_start = Diese Konversation wird uns nicht weiter führen! Ich werde dich nicht hier durch lassen! Unter keinen Umständen wirst du diesen Chip deaktivieren!

keine_flucht = Du versuchst zu fliehen, aber Arthur lässt dich nicht abhauen.

besiegt = Du besiegst Arthur und er fällt Ko auf den Boden. Davor versucht er jedoch dir noch was zu sagen.

letzte_worte = Diese Welt ist dem Untergang geweiht... Menschen werden nie perfekt sein können. Freier Wille ist der Fluch der diesen Planeten plagt... du bist nur zu einsichtig das zu realisieren...

finale_choice = Du stehst vor dem Server mit einem Losen Chip drinnen. Für was entscheidest du dich?


raus_nehmen = Computer-Chip entfernen
rein_legen_kaputt = Kaputter Computer-Chip einsetzten
rein_legen_heile = Reparierter Computer-Chip einsetzten
aufgeben = Computer-Chip wieder reinschrauben