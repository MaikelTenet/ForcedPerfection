scan = Eine Bauarbeiterin, welche eine leicht angebrannte Haut und rot anschwellende Narben zu habe scheint. Sie ist viel zu schlau um eine Bauarbeiterin zu sein. Sie scheint außerdem sehr skeptisch über die Menschen hier in der Nähe zu sein.

begrüssung = Was machst du hier? Hau ab, es ist sehr gefährlich hier. Ihr Touristen nervt und ich hab keine Lust, dass sich irgendwer hier verletzt!
pipe_geklaut = Hast du ernsthaft das Metal Rohr da hinten geklaut? Als wenn es hier nicht schon gefährlich genug ist, klaut ihr hier auch noch Zeugs!
pipe_gefallen = Vor kurzem hat irgendwer hier dieses Metal Rohr durchgeschnitten und seitdem ist es hier gefährlich. Das wird, einen Stromschlag über die ganze Baustelle ausgelöst haben. Jeder der hier war, hat vermutlich einen ordentlichen Schlag bekommen.
nervig = Du gehst mir ziemlich auf die Nerven, weißt du das? Lass mich jetzt endlich in Ruhe.

bauen_antwort = Was wir aufbauen... haha... also... das ist wahrlich eine gute Frage... ich bin ganz ehrlich mit dir, seit geraumer Zeit ist meine Erinnerung nicht mehr das Beste. Außerdem verhalten sich die ganzen Menschen hier seltsam...
teammates_antwort = Wo meine Arbeitskollegen sind... haha... also... das ist wahrlich eine gute Frage... ich bin ganz ehrlich mit dir, seit geraumer Zeit ist meine Erinnerung nicht mehr das Beste. Außerdem verhalten sich die ganzen Menschen hier seltsam...
keine_hilfe = Hilfe? Von so nem Schwächling wie dir? Du wirst vermutlich nicht mal, eine Schaufel tragen können. Abgesehen davon, brauche ich keine Hilfe, ich bekomme das hier schon selber hin!
auch_bitchin = Ich geb dir gleich unhöflich. Auf so jemanden wie dir hab ich grad absolut nicht den Nerv für, also hau jetzt ab!

hinterfragen = Was genau ist hier so gefährlich?
was_bauen = Was genau baut ihr hier?
helfen = Kann ich beim Aufbauen helfen?
beschwären = Warum bist du so unhöflich? Ich hab dir nichts getan?
stess = Du siehst, aber sehr gestresst aus.
teammates = Wo sind deine Arbeitskollegen?

was_seltsam = Was genau meinst du mit seltsamen Sachen?
warum_erinnerung_seltsam = Weißt du, warum deine Erinnerungen so seltsam sind?
freier_wille = Würdest du sagen du besitzt einen freien Willen?
beschäftigung = Was machst du den ganzen Tag lang?

seltsam_antwort = Ist dir aufgefallen, wie robotich die ganzen Menschen hier herumlaufen? Als ob jeder von Aliens oder so gesteuert wird. Ich hab etwas gebraucht, um das zu realisieren, aber jeder verhält sich komisch und verbreitet gruselig viel Freude. Du bist die erste Person, seit einer langen Zeit, welche sich halbwegs normal verhällt.
erinnerungen_antwort = Nein, ich habe versucht mich an meine Kindheit zu erinnern, aber alles ist weg. Ich weiß nicht mal meinen echten Namen. Ich bin vermutlich nicht mal ein Bauarbeiter... ich weiß nur noch, dass ich es geliebt habe Sachen zu bauen, aber es gibts nichts was ich bauen oder zumindest reparieren könnte...
freier_wille_antwort = Wie meinst du das? Glaubst du, dass die anderen Menschen keinen freien Willen haben? Aber das würde keinen Sinn ergeben, was würde uns beide von den anderen unterscheiden?
beschäftigung_antwort = Ich hab herausgefunden, dass ich vor meinem Gedankenverlust die ganze Zeit hier abhing. Ich habe nie diese Baustelle verlassen, nicht mal fürs Schlafen und essen. Seitdem versuche ich ab und an mal spazieren zu gehen, aber es fühlt sich falsch an, zu gehen.

bauen = Würdest du etwas für mich bauen?
willst_du_bauen = Vielleicht kommen deine Erinnerungen zurück, wenn du etwas machst, was dir spaß macht.

für_dich_bauen = Ich sehne mich seit ewigkeiten danach wieder etwas Sinnvolles zu bauen. Gibt es etwas was ich für dich bauen könnte?
bauen_erinnerungen = Das ist eine sehr interessante Prognose. Ich vermisse es etwas Sinnvolles zu bauen. Gibt es etwas was ich für dich bauen könnte?

nichts_bauen = Ich habe momentan leider nichts zum Bauen.
enttäuscht = Hm schade... Falls du irgendetwas findest, was meine hilfe benötigt komm gerne zu mir.

wiedersehen = Hey, da bist du ja, wieder! Hast du inzwischen etwas gefunden, was ich bauen oder reparieren kann?
buch_öffnen = Kannst du was erfinden, was dieses Buch hier öffnen kann?
kein_buch_öffnen = Scheint als, wenn du einfach ein Passwort, dafür brauchst. Ich werde dir nicht helfen die Geheimnisse von jemanden herauszufinden... aber der Magier auf der Hauptstraße, meinte mal zu mir er hätte ein seltsames Passwort gefunden, vielleicht passen die ja zusammen.
chip_geben = Ich habe hier einen kaputten Computer-Chip, den man reparieren müsste.
chip_annehmen = Zeig mal her... sehr interessant, dieser Chip scheint noch in Takt zu sein, aber die Programmierung scheint fehlerhaft zu sein. Ich könnte ihn reparieren, aber du müsstest dafür paar Sachen auftreiben. Wärst du bereit das zu tun?
annehmen = Ich kann dir besorgen, was du brauchst
ablehnen = Vielleicht ein anderes Mal
annehmen_reaktion = Sehr gut! Ich bräuchte zwei Sachen von dir. Eines wäre der Programmcode des Chips, da er momentan unvollständig ist. Allerdings scheint der Chip eine Verifizierung zu brauchen. Du müsstest mir also ein Gerät bringen, welches einer ähnlichen Abstammung entspringt. Ich nimm dir währenddessen mal den Chip ab, bevor du ihn ausversehen irgendwo einsteckst, wo er was kaputt machen könnte.
ablehnen_reaktion = Du willst doch nicht meine Hilfe? Du bist seltsam... falls du es dir doch andres überlegt, komm ruhig wieder zurück

alles_abgeben = Ich habe alles geholt, was du brauchst
woher_scanner = Woher soll ich ein Gerät ähnlicher Abstammung bekommen?
scanner_zeigen = Ich habe diesen Scanner hier bekommen.
woher_code = Woher soll ich den Programmcode bekommen?
code_zeigen = Ist dieser Programmcode richtig?
chip_infos = Hast du herausgefunden, was der Chip macht?
# Arthur
woher_scanner_antwort = Siehst du dieses Logo? Ich habe das schon mal gesehen! Eine Person, welche sich {0} nennt, kam hier mal vorbei. Er hatte eine Art Scanner bei sich, mit dem er mich analysiert hat. Ich glaube da war genau dasselbe Logo drauf. Ich würde, mal nach ihm suchen!
#Sandra
scanner_zeigen_antwort = Sehr interessant... Seltsam ich habe damit gerechnet, dass hier dieselbe Gravur dieser Sandra drauf wäre, aber er scheint trotzdem mit dem Chip kompatible zu sein! Wahrlich interessantes Ding!
woher_code_antwort = Ich gehe mal davon aus, dass der Junkie, dir nicht den Code geben kann... Ich würde an deiner Stelle, jeden Computer in der Nähe einmal absuchen. Er wird hier irgendwo in der Nähe sein!
code_zeigen_antwort = Du hast tatsächlich den Programmcode gefunden! Er scheint die Bugs des Chips zu beheben und er hat auch eine Funktion, wodurch er alle verbundenen Chips direkt Updaten würde!
chip_infos_antwort = Der Chip scheint Glückshormone auszustrahlen! Jeder der ihn in seinem Kopf hat, scheint übermäßig glücklich zu sein... das muss der Grund sein, warum jeder so positv ist... aber warum verhalten sich, dann trotzdem alle so seltsam?

fehlfunktion = Vermutlich hat der Chip eine Fehlfunktion
fehlfunktion_antwort = Das wäre sehr katastrophal. Wir wissen nicht wie viel, von diesem Chip beeinflusst werden, aber die Vorstellung, dass auf haufen Menschen keine Kontrolle über Ihren Körper haben ist grausam
wie_antworten = Wie sollen wir bloß, alle diese Fragen beantworten?
antworten_auf_alles = Weißt du, vor kurzem kam der Magier hier vorbei und hat was von einem Passwort, was alle Geheimnissen lüftet erzählt. Ich glaube, der Typ spinnt einfach nur, aber es würde vielleicht nicht schaden der Sache auf der spur zu gehen!

zusammenbauen = Das ist perfekt! Der Chip scheint unausgereift zu sein, aber mit dem Programmcode und der Verifizierung sollte ich das im Handumdrehen fertig gebaut bekommen.
warten = Warten
fertig_gebaut = Hier, der Chip sollte jetzt wieder funktionstüchtig sein! Beim Umbauen hab ich gemerkt, dass er eine Fehlfunktion hatte, welche den Menschen die Kontrolle über sich selbst wegnimmt! Ich befürchte, dass die ganzen Menschen hier darunter leiden. Ich würde selbst versuchen, sie zu retten, aber ich muss erstmal paar Sachen verarbeiten, die ich herausgefunden habe... Ich bitte dich... rette die Menschen hier...

wiedersehen_nach_reparatur = Was machst du hier? Du solltest herausfinden, wie du diesen Chip austauschen kannst!

chip_origin = Hast du herausgefunden, woher dieser Chip kommt?
verarbeitung = Was meintest du mit, du musst paar Sachen verarbeiten...
wo_austauschen = Wo ist der Chip, den ich austauschen soll?

origin_antwort = Ich habe durchaus... einiges über diesen Chip herausgefunden... aber woher dieser Chip kommt, konnte ich nicht herausfinden... Vor kurzem kam hier ein verrückter Magier vorbei. Er meinte, er hätte, die Antwort auf alle Fragen! Ich glaube nicht, dass er wirklich helfen kann, aber falls es irgendwo da draußen eine Antwort auf unsere Fragen gibt, glaube ich, dass er die hat!
verarbeitung_antwort = In diesem Chip war der Name "Sandra" eingraviert. Ich war sehr verblüfft von Ihrem technischen Meisterwerk, soweit dass ich traurig war sie vermutlich niemals kennenlernen zu können. Je mehr ich allerdings an diesem Chip gearbeitet habe, desto klarer wurde mir alles... ich kenne diesen Chip... ich... ich... sorry ich brauche kurz einen Moment für mich selbst...
austauschen_antwort = Dieser Arthur Typ kam hier öfters mal vorbei. Er schien sicherzustellen, dass ich immer noch hier bin, warum auch immer. Doch dann sah ich ihn in das Gebäude direkt hier im Osten zu gehen. Wenn er diesen Scanner besitzt, wird er was mit diesem Chip zu tun haben. Du musst irgendwie in das Gebäude hier rechts kommen!

kein_kampf = Greifst du mich gerade an? Lass mich in Ruhe, mein Tag war schon stressig genug, da hab ich kein Bock, jemanden wie dich zu verprügeln
kein_kampf2 = Greifst du mich gerade an? Hol lieber die Sachen, die wir brauchen, damit wir den Chip reparieren können!
kein_kampf3 = Greifst du mich gerade an? Wir haben wichtigere Sachen zu tun! Du musst herausfinden wie du diesen Chip austauschen kannst!