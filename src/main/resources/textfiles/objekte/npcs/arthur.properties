scan = Das ist Arthur. Er scheint so wie du zu sein. Er weiß mehr über diese Welt als es den anschein hat. Vielleicht ist er die einzige Person auf dieser Welt der wie du einen FREIEN WILLEN hat

dialog0 = Wieso kommst du zu mir? Warum sprichst du mich an?
dialog1 = Also das... ähm... du hast bemerkt, dass ich dich angestarrt habe? Ah ja das ist interessant... Seltsame Frage, aber was ist deine Gefühlslage gerade?
dialog2 = Huh? Keine positiven Gefühle? Das ist ja höchst interessant... so was hab ich ja lange nicht mehr gesehen...
dialog3 = Glaub mir, du weißt nicht was wirklich seltsam ist. Du scheinst wahrlich einen FREIEN WILLEN zu haben... das ist höchst interessant...
dialog4 = Unsere Welt ist nun mal sehr schön, weißt du! Man sieht nicht oft jemanden wie dich... Du scheinst, wahrlich einen FREIEN WILLEN zu haben... das ist höchst interessant...
oma_ko_reaktion = Das... du hast wahrlich die Oma da Ko geschlagen... du hast wahrlich einen FREIEN WILLEN... ob manche Menschen den verdienen oder nicht ist eine andre Sache...
dialog6 = Du willst also... ähm? Du weißt von meinem Scanner? Woher weißt du davon!
dialog7 = Dieses Plappermaul kann auch keine 3 Sekunden seinen Mund schließen! Du willst also den Scanner ausprobieren! Dann sag mal was du als Gegenleistung hast?
dialog8 = Du hast ihn in meiner Hand gesehen? Und willst ihn selber haben? Moment wann hab ich jemals den Scanner in deiner Nähe rausgeholt? Und woher weißt du, dass das ein Scanner ist???
dialog9 = Du willst also nicht sehr viel darum herumreden scheint mir! Hmmm. Ich habe nicht sehr viel was ich brauche. Was würdest du mir den für den Scanner anbieten?
dialog10 = Du willst einen Kampf? HAHAHA! Sagen wir es so... das wäre keine sehr gute Idee...
dialog11 = Eine Leistung gegen eine Leistung also... Das Prinzip auf das diese Gesellschaft aufbaut... Das fühlt sich nicht richtig an. Wir sind nicht so Gedankenlos wie die anderen hier, richtig?
oma_erzählt = Die alte Frau da vorne hat mir von ihrem Scanner erzählt.
old_people_rant = Immer diese Alten Menschen die alle immer anstarren... Du willst also den Scanner ausprobieren! Dann sag mal was du als Gegenleistung hast?
sandra_erzählt = Die Bauarbeiterin meinte, sie hätten den bei dir gesehen.
sandra_interesse = Die Bauarbeiterin also... sie ist mir schon etwas länger aufgefallen... Du willst also den Scanner ausprobieren! Dann sag mal was du als Gegenleistung hast?

massieren = Ich kann dich massieren!
massieren_ablehnen = Du willst mir eine Massage anbieten? Ich war tatsächlich damals einer der besten Masseure im ganzen Land. Da musst du schon was Besseres anbieten.
best_buddies = Wir sind "Freier Wille" Buddys! Da kann man sich doch bestimmt untereinander aushelfen!
buddy_ablehnen = Ich habe Jahre vor dir meinen FREIEN WILLEN zurückgewonnen. Du bist nur eine reine Imitation von mir. Ich sehe dich mehr als einen Gegenspieler an, als einen Buddy.

dialog100 = Sehr gut, jetzt verschwinde wieder
dialog101 = Ach nevermind, du bist genauso seltsam wie die ganzen anderen Idioten hier

dialog103 = Falls du nicht weißt, was du machen sollst dann würde ich mich mal in einem Raum UMSEHEN. In jedem Raum kannst du bestimmt mit Menschen SPRECHEN. Falls Sachen herumliegen, dann fühl dich nicht schlecht, sondern NIMM sie einfach. Das sollte eigentlich genug HILFE fürs erste sein. Jetzt lass mich in Ruhe, ich muss nachdenken!
dialog104 = Nerv nicht mich, sondern die anderen Menschen hier. Du kannst bestimmt paar interessante Sachen herausfinden wenn du mit denen SPRICHST
dialog107 = Was willst du von mir du NPC? Ich gebe meinen Scanner nicht zu irgendjemanden ohne FREIEN WILLEN! Du solltest nicht mal davon wissen.
dialog108 = Du weißt vom Chip von Markus??? Es gibt einige Sachen, von denen du nichts wissen musst und das ist auf jeden Fall einer dieser Dinge
dialog109 = Du bist wahrlich ein erstaunliches menschliches Wesen
dialog110 = Du willst das ich dir den Scanner einfach so schenke? Also... Weißt du was warum nicht! Ich bin gespannt was du damit machen wirst.
dialog111 = Schreibe einfach "Scan" und den jeweiligen Namen der Person um mehr über ihr Leben herauszufinden. Du kannst auch versuchen in einem Kampf mal "scan" zu schreiben. Vielleicht findest du dann mehr über ihren Kampfstyle heraus
dialog112 = Ich vermisse es mit Menschen, ohne FREIEN WILLEN zu sprechen...
dialog113 = Der Typ soll endlich aufhören mir Dankesbriefe zu schreiben! Ich will die nicht. Kannst den weg werfen, ich brauche die nicht!
dialog-1 = Ich sagte doch ich will nicht mit dir abhängen, lass mich in Ruhe!
dialog-2 = Was gibt es? Du solltest dich doch mit anderen unterhalten
dialog-3 = Du hast doch schon meinen Scanner was willst du noch?

antwort1 = Du hast mich angestarrt. Ich wollte fragen was los ist.
antwort2 = Sorry ich wollte dir nicht auf die Pelle rücken
antwort3 = Sehr unwohl! Immerhin beobachtest du mich gerade die ganze Zeit???
antwort4 = Sehr glücklich. Dass du mich beobachtest, heißt, dass wir Freunde sein können!
antwort5 = Ich fühle mich verwirrt, warum fragst du mich nach meiner Gefühlslage?
antwort6 = Du bist seltsam weißt du das?
antwort7 = Was meinst du mit lange nicht mehr gesehen?

freien_willen_hiterfragen = Was meinst du mit FREIEM WILLEN?
jeder_freier_wille = Hat nicht jeder Mensch einen FREIEN WILLEN?
freier_wille_antwort = Was ist freier Wille und was ist keiner? Du scheinst nicht mit vielen Menschen hier zu sprechen. Schau dich mal etwas um und sprich mit paar Menschen. Du wärst wahrlich überrascht, wie seltsam unsere Welt wahrlich ist...

antwort12 = Markus hat mir davon erzählt!
antwort13 = Ich hab ihn in deiner Hand grad eben gesehen!
antwort14 = Wir können dafür kämpfen!
antwort15 = Ich kann eine lange Sidequest dafür machen!
antwort16 = Ich finde, du solltest es mir schenken!
antwort17 = Was muss ich für ihn machen?
antwort18 = Das sind mir zu viele Fragen, ich bin raus
antwort19 = Du bist echt richtig unhöflich. Kein Fan von dir
antwort20 = Ich weiß nicht, was ich tun soll!
antwort21 = Ich will dir auf die Nerven gehen!
antwort22 = Was macht der Scanner?
antwort23 = Ich will den Scanner nicht mehr!
antwort24 = Ich habe einen Brief von Markus, den ich dir geben sollte
antwort25 = Ich hab die Oma da drüben Ko geschlagen
antwort26 = Was macht der Chip von Markus?
antwort27 = Kannst du mir den Scanner geben?

attak_know = Vollidiot! Was greifst du mich an??? Nutz deinen FREIEN WILLEN für etwas Nützliches und lass mich in Ruhe
attak_unkwno = Versuchst du gerade mit mir zu kämpfen? Ne das bilde ich mir vermutlich nur ein...